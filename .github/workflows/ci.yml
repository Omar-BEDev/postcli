name: C/C++ CI - Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools & GoogleTest
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev cmake

      - name: Build postcli binary
        run: make

      - name: Run Unit Tests
        run: make test
